<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0507">
<title>Lights</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1 id="title">Lights</h1>
  <div class="sub">Custom modes for your Bluetooth rope lights.</div>

  <div id="unsupported" class="panel warn" hidden>
    This browser can't reach Bluetooth. On iPhone, open this page in the free <b>Bluefy</b> browser app.
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:12px">
      <div id="dot" class="dot"></div>
      <div id="status" class="status">Not connected</div>
    </div>
    <button id="connect">Connect to lights</button>
  </div>

  <div class="panel">
    <div id="modePicker" style="margin-bottom:14px">
      <select id="mode" aria-label="Mode"></select>
    </div>
    <div id="sourceBox" hidden>
      <label>Sound from</label>
      <div class="seg" id="source">
        <button data-v="mic" class="sel">Microphone</button>
        <button data-v="share">Music on this computer</button>
      </div>
      <div id="sourceHint" class="mode-desc" hidden>
        Press Start, then pick the Chrome tab playing music (or Entire Screen for the Spotify or Music app) and turn on the audio switch.
      </div>
    </div>
    <div id="orb"></div>
    <button id="go" class="primary" disabled>Start</button>
    <div id="modeDesc" class="mode-desc"></div>
    <div id="settings"></div>
  </div>

  <div class="panel">
    <div class="grid2">
      <button id="testRed" disabled>Solid red</button>
      <button id="off" disabled>Lights off</button>
    </div>
    <details style="margin-top:12px">
      <summary>Advanced</summary>
      <label>Drive brightness with</label>
      <div class="seg" id="method">
        <button data-v="color" class="sel">Color level</button>
        <button data-v="bright">Brightness cmd</button>
      </div>
      <label>Updates per second <span id="rateV"></span></label>
      <input id="rate" type="range" min="5" max="60" value="40">
      <label><input id="showAll" type="checkbox"> Show every Bluetooth device when connecting</label>
      <div id="log"></div>
    </details>
  </div>

<script type="module" src="js/app.js"></script>
</body>
</html>
